title: Homework Coach
description: 'Photograph a child''s homework and Homework Coach records the skills, task formats
  and slips in a per-child learning brief, then builds a fresh, verified daily practice packet:
  a printable PDF per child plus a separate parent answer key. Parents rate items I/S/N and the
  next packet adapts one step at a time. Elementary math (31 task formats), with an Automation
  Blueprint for scheduled delivery to chat and a Desktop panel. Photos go to the user''s
  configured model provider through ctx.llm; all other data stays in plugin-data.'
