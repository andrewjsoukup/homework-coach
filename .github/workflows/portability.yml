name: Homework Coach portability

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  components:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.11'
          - os: windows-latest
            python: '3.14'
          - os: macos-latest
            python: '3.14'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      HERMES_HOME: ${{ github.workspace }}/../homework-test-home
      HERMES_BASE_HOME: ${{ github.workspace }}/../homework-test-home
      HERMES_DISABLE_LAZY_INSTALLS: '1'
      TMPDIR: ${{ github.workspace }}/..
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Install isolated Python test dependencies
        run: |
          python -m pip install --disable-pip-version-check uv
          uv sync --no-install-project --group dev
      - name: Run backend and HTTP contract tests
        run: uv run --no-sync python -m pytest -ra --basetemp="$RUNNER_TEMP/homework-pytest"
      - name: Install locked developer-only JS dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Reject a stale shipped interface
        run: npm run check:bundle
      - name: Run UI and transport contract tests
        run: npm test
