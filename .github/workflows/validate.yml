name: Homework Coach validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hermes-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the plugin
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: plugin
          persist-credentials: false

      - name: Check out the tested Hermes version
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: NousResearch/hermes-agent
          ref: b200f5bc60e31588ba2cb60e288029c4a54ba5fa
          path: hermes
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare the locked toolchain
        working-directory: hermes
        run: >-
          python3 -S scripts/ci/setup_toolchain.py prepare
          --toolchain python --home "$RUNNER_TEMP/homework-validator-home"

      - name: Install the locked toolchain
        working-directory: hermes
        run: >-
          python3 -S scripts/ci/setup_toolchain.py install
          --toolchain python --home "$RUNNER_TEMP/homework-validator-home"

      - name: Build an isolated validator runtime
        working-directory: hermes
        run: |
          "$HERMES_PYTHON" - <<'PY'
          import os
          from pathlib import Path
          from pm import build_environment
          source = Path.cwd()
          python = build_environment(source=source, out=source / ".build/validator", explicit=True)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"VALIDATOR_PYTHON={python}\n")
          PY

      - name: Validate with dependency installation
        working-directory: hermes
        run: >-
          "$VALIDATOR_PYTHON" -I -m hermes_cli.main plugins validate
          "$GITHUB_WORKSPACE/plugin" --install-deps

      - name: Validate catalog structure
        working-directory: hermes
        run: >-
          "$VALIDATOR_PYTHON" scripts/validate_plugin_catalog.py
          "$GITHUB_WORKSPACE/plugin/catalog/homework-coach.yaml"
